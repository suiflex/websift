<!DOCTYPE html>
<html lang="en">
  <head><title>test at DuckDuckGo</title></head>
  <body>
    <form action="/lite/" method="post"><input name="q" value="test" /></form>
    <table>
      <tr><td class="result-sponsored">Ad</td></tr>
      <tr>
        <td><a rel="nofollow" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Farticle&amp;rut=abc" class="result-link">Example
          title</a></td>
      </tr>
      <tr><td class="result-snippet">Result snippet   with  collapsed whitespace.</td></tr>
      <tr>
        <td><a rel="nofollow" href="https://example.org/second" class="result-link">Second title</a></td>
      </tr>
      <tr><td class="result-snippet">Second snippet.</td></tr>
      <tr>
        <td><a rel="nofollow" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Farticle" class="result-link">Duplicate title</a></td>
      </tr>
      <tr><td class="result-snippet">Duplicate snippet.</td></tr>
      <tr>
        <td><a rel="nofollow" href="http://127.0.0.1:8080/private" class="result-link">Local title</a></td>
      </tr>
      <tr><td class="result-snippet">Private address that must be rejected.</td></tr>
      <tr>
        <td><a rel="nofollow" href="https://example.net/third" class="result-link">Third title</a></td>
      </tr>
      <tr><td class="result-snippet">Third snippet.</td></tr>
    </table>
  </body>
</html>
