name: Release

on:
  push:
    tags: ['v*']
  # Registry-only recovery for a tag that already built and released. A registry
  # hiccup must not mean rebuilding binaries or re-pushing taps that succeeded.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish to crates.io and npm
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compiled from the Apple Silicon runner: the Intel macOS runner is retired.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          release_dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          # The binary must sit at the archive root: both installers extract it flat.
          case "${{ matrix.target }}" in
            *windows*)
              binary="websift.exe"
              asset="websift-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
              (cd "$release_dir" && 7z a "$OLDPWD/dist/$asset" "$binary" > /dev/null)
              ;;
            *)
              binary="websift"
              asset="websift-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
              tar -czf "dist/$asset" -C "$release_dir" "$binary"
              ;;
          esac
          # `websift update` downloads the bare binary, so it needs no archive support.
          bare="websift-${GITHUB_REF_NAME}-${{ matrix.target }}"
          case "${{ matrix.target }}" in *windows*) bare="$bare.exe" ;; esac
          cp "${release_dir}/${binary}" "dist/$bare"
          cd dist
          for file in "$asset" "$bare"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: websift-*

  # ---- distribution channels: siblings, both need `publish`, neither needs the other ----
  # A failure in one does not cancel the other. Both push with secrets.TAP_PUBLISH_TOKEN.
  #
  # Assets and their .sha256 files come from this run's artifacts rather than from
  # `gh release download`: they are already built and hashed, so there is nothing to
  # re-fetch and no race against release-asset propagation.

  publish-homebrew:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Render formula and push to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # The build job wrote `<file>  <name>` next to each archive; take the digest field.
          sha() { cut -d' ' -f1 < "dist/websift-${TAG}-$1.tar.gz.sha256"; }

          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@MAC_ARM_SHA@|$(sha aarch64-apple-darwin)|g" \
              -e "s|@MAC_X64_SHA@|$(sha x86_64-apple-darwin)|g" \
              -e "s|@LINUX_ARM_SHA@|$(sha aarch64-unknown-linux-gnu)|g" \
              -e "s|@LINUX_X64_SHA@|$(sha x86_64-unknown-linux-gnu)|g" \
              packaging/websift.rb.tmpl > websift.rb
          # A leftover placeholder means a missing artifact; fail loudly rather than
          # pushing a formula that cannot install.
          ! grep -q '@[A-Z_]*@' websift.rb

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv websift.rb tap/Formula/websift.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/websift.rb
          git commit -m "websift ${VERSION}" || { echo "no change"; exit 0; }
          git push

  publish-scoop:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Render manifest and push to the bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          win_sha="$(cut -d' ' -f1 < "dist/websift-${TAG}-x86_64-pc-windows-msvc.zip.sha256")"

          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@WIN_X64_SHA@|${win_sha}|g" \
              packaging/websift.json.tmpl > websift.json
          ! grep -q '@[A-Z_]*@' websift.json
          jq empty websift.json

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          mv websift.json bucket/bucket/websift.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/websift.json
          git commit -m "websift ${VERSION}" || { echo "no change"; exit 0; }
          git push

  # ---- registries: published through GitHub OIDC Trusted Publishing ----
  # No registry token is stored. Both registries verify the repository, the workflow file, and
  # the environment name, so `Release` must exist and must not be renamed.

  publish-crates:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          # A crates.io version is immutable, so refuse to publish one that does not match the
          # tag rather than burning the number on the wrong source.
          [ "$manifest" = "$VERSION" ] || {
            echo "::error::Cargo.toml is $manifest but the tag is $VERSION"; exit 1; }
          # The sparse index is what cargo itself resolves against and updates within seconds.
          # `cargo search` hits the separate search service, which can lag past any timeout.
          if curl -sf "https://index.crates.io/we/bs/websift" | grep -q "\"vers\":\"${VERSION}\""; then
            echo "websift ${VERSION} is already on crates.io"
          else
            cargo publish
          fi

  publish-npm:
    # Must follow `publish`: the package's postinstall downloads the release assets, so
    # publishing first would leave anyone installing in the gap with a 404.
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 and node 20 ships npm 10. Stay below npm 12,
      # which drops the node 20 runner.
      - run: npm install -g npm@11.5.2
      - name: Publish to npm
        working-directory: npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish --access public

  recover-registries:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if curl -sf "https://index.crates.io/we/bs/websift" | grep -q "\"vers\":\"${VERSION}\""; then
            echo "websift ${VERSION} is already on crates.io"
          else
            cargo publish
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.5.2
      - name: Publish to npm if missing
        working-directory: npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if npm view "@suiflex/websift@${VERSION}" version >/dev/null 2>&1; then
            echo "@suiflex/websift ${VERSION} is already on npm"
          else
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            npm publish --access public
          fi
