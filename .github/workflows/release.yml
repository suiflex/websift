name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          release_dir="target/${{ matrix.target }}/release"
          # The binary must sit at the archive root: both installers extract it flat.
          case "${{ matrix.target }}" in
            *windows*)
              asset="websift-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
              (cd "$release_dir" && 7z a "$OLDPWD/$asset" websift.exe > /dev/null)
              ;;
            *)
              asset="websift-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
              tar -czf "$asset" -C "$release_dir" websift
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            websift-*.tar.gz
            websift-*.zip
            websift-*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            websift-*.tar.gz
            websift-*.zip
            websift-*.sha256
